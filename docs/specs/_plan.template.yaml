# plan manifest テンプレート（ADR 0004）。docs/specs/<feature>.plan.yaml として複製して使う。
feature: <slug>
spec: docs/specs/<feature>.md
items:
  - id: <slug-item>
    title: <PR タイトル相当>
    scope:                       # 触るファイル/ディレクトリ。重なる item は直列化
      - <path/...>
    depends_on: []               # 依存 item id
    agent: pipeline-dev          # pipeline-dev | source-scout | analyst
    acceptance: <完了条件（テスト観点／レポート観点）>
    status: todo                 # todo | in_progress | in_review | pr_open | merged | blocked
    pr:

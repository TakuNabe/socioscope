[project]
name = "socioscope-core"
version = "0.1.0"
description = "Shared library: fetching with provenance, LLM structuring, Parquet/DuckDB storage, theme CLI"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "anthropic>=1.0",
  "duckdb>=1.1",
  "pyarrow>=17",
  "polars>=1.10",
  "typer>=0.12",
]

[project.scripts]
socioscope = "socioscope_core.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/socioscope_core"]

[project]
name = "theme-growth-fertility"
version = "0.1.0"
description = "Theme: economic growth vs fertility (cross-country and within-country)"
requires-python = ">=3.13"
dependencies = [
  "socioscope-core",
  "pydantic>=2.9",
  "polars>=1.0",
  "pyarrow>=17",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "pypdf>=5.0",
]

[project.entry-points."socioscope.themes"]
growth-fertility = "theme_growth_fertility.wiring:PIPELINE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theme_growth_fertility"]

[project]
name = "theme-wealth-population-distribution"
version = "0.1.0"
description = "Theme: population and wealth/income distribution since 1945 (world and Japan)"
requires-python = ">=3.13"
dependencies = [
  "socioscope-core",
  "pydantic>=2.9",
  "polars>=1.0",
  "pyarrow>=17",
  "matplotlib>=3.9",
]

[project.entry-points."socioscope.themes"]
wealth-population-distribution = "theme_wealth_population_distribution.wiring:PIPELINE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theme_wealth_population_distribution"]
